# =============================================================================
# Premium Marketing Website - Docker Compose for Development
# =============================================================================
# Usage:
#   Development:  docker-compose up
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Development Server
  # ---------------------------------------------------------------------------
  dev:
    image: node:20-alpine
    container_name: premium-site-dev
    working_dir: /app
    ports:
      - "3002:3000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Use named volume for node_modules to improve performance
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Production Build (for testing production builds locally)
  # ---------------------------------------------------------------------------
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-site-prod
    ports:
      - "8080:80"
    profiles:
      - production

# Named volumes
volumes:
  node_modules:
