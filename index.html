<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create fun selfies with your favorite celebrities using AI-powered image composition">
  <title>Selfie PullAI - Celebrity Selfie Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Selfie PullAI</h1>
    <button class="info-btn" aria-label="About this app">ℹ️</button>
  </header>

  <main class="app-main">
    <!-- Section 1: Template Carousel -->
    <section id="templates" class="section-templates" aria-labelledby="templates-heading">
      <h2 id="templates-heading" class="visually-hidden">Celebrity Templates</h2>
      <div class="carousel-container">
        <!-- Templates will be rendered here by JS -->
      </div>
    </section>

    <!-- Section 2: Upload Area -->
    <section id="upload" class="section-upload" aria-labelledby="upload-heading">
      <h2 id="upload-heading" class="visually-hidden">Upload Your Photo</h2>
      <div class="upload-zone" role="button" tabindex="0" aria-label="Drop an image here or click to upload">
        <p>Drag & drop your photo here</p>
        <p>or</p>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
        <label for="file-input" class="upload-btn">Choose File</label>
        <button id="camera-btn" class="camera-btn" aria-label="Take a photo with camera">📷 Take Photo</button>
      </div>
    </section>

    <!-- Section 3: Editor Panel -->
    <section id="editor" class="section-editor" aria-labelledby="editor-heading">
      <h2 id="editor-heading" class="visually-hidden">Image Editor</h2>
      <div class="canvas-container">
        <canvas id="preview-canvas" aria-label="Image preview canvas"></canvas>
      </div>
      <div class="controls">
        <!-- Controls will be added in a later feature -->
      </div>
    </section>

    <!-- Section 4: Action Buttons -->
    <section id="actions" class="section-actions" aria-labelledby="actions-heading">
      <h2 id="actions-heading" class="visually-hidden">Actions</h2>
      <div class="action-buttons">
        <button id="download-btn" class="action-btn" disabled>⬇️ Download</button>
        <button id="share-btn" class="action-btn" disabled>🔗 Share</button>
        <button id="reset-btn" class="action-btn" disabled>🔄 Reset</button>
        <button id="history-btn" class="action-btn">📜 History</button>
      </div>
    </section>

    <!-- History Panel (Hidden by default) -->
    <aside id="history-panel" class="history-panel" hidden aria-labelledby="history-panel-heading">
      <h2 id="history-panel-heading">Recent Creations</h2>
      <div class="history-grid">
        <!-- History items will be rendered here by JS -->
      </div>
      <button id="close-history-btn" class="close-btn" aria-label="Close history panel">✕</button>
    </aside>
  </main>

  <footer class="app-footer">
    <p>&copy; 2025 Selfie PullAI. All processing happens on your device.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
